<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Push broom / floor sweeper sweeping with dust cloud -->

  <!-- Handle (angled, upper-right to lower-center) -->
  <line x1="380" y1="48" x2="220" y2="320"
        stroke="#7C3AED" stroke-width="28" stroke-linecap="round"/>

  <!-- Broom head block (wide, at angle) -->
  <rect x="120" y="300" width="220" height="52" rx="14" fill="#7C3AED"
        transform="rotate(-20, 230, 326)"/>

  <!-- Bristles fanning downward-left from head -->
  <line x1="88"  y1="352" x2="58"  y2="424" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="114" y1="360" x2="90"  y2="432" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="140" y1="366" x2="122" y2="436" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="166" y1="368" x2="154" y2="440" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="192" y1="366" x2="186" y2="436" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="218" y1="360" x2="218" y2="430" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="244" y1="350" x2="250" y2="422" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="268" y1="336" x2="280" y2="408" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" opacity="0.9"/>

  <!-- Dust cloud (right side, being swept up) -->
  <circle cx="348" cy="430" r="38" fill="#7C3AED" opacity="0.15"/>
  <circle cx="392" cy="412" r="28" fill="#7C3AED" opacity="0.12"/>
  <circle cx="430" cy="440" r="34" fill="#7C3AED" opacity="0.10"/>
  <circle cx="370" cy="456" r="24" fill="#7C3AED" opacity="0.13"/>
  <circle cx="416" cy="460" r="20" fill="#7C3AED" opacity="0.10"/>

  <!-- Dust particles -->
  <circle cx="340" cy="410" r="8" fill="#7C3AED" opacity="0.35"/>
  <circle cx="390" cy="390" r="6" fill="#7C3AED" opacity="0.30"/>
  <circle cx="420" cy="418" r="7" fill="#7C3AED" opacity="0.30"/>
</svg>
